[tools]
node = "26.12.1"
rust = "1.99.1"

[tasks]
dev = "cd frontend && npm run dev"
build = "cd frontend && npm run build"
test = "cd frontend && npm test"
test:core = "cd core && cargo test"
build:wasm = "cd core && wasm-pack build --release --target web --out-dir ../frontend/pkg"
build:all = "cd core && wasm-pack build --release --target web --out-dir ../frontend/pkg && cd frontend && npm run build"